name: Build Windows litellm 1.93.0 cp313 wheel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout official litellm v1.93.0 source
        uses: actions/checkout@v4
        with:
          repository: BerriAI/litellm
          ref: v1.93.0
          submodules: false
          fetch-depth: 1

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install fixed version Rust (compatible with litellm 1.93.0)
        uses: dtolnay/rust-toolchain@1.78.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin==1.6.0 setuptools wheel

      - name: Build whl package (cp313)
        run: maturin build --release --target x86_64-pc-windows-msvc --out dist

      - name: List dist files
        run: ls dist

      - name: Upload built artifact
        uses: actions/upload-artifact@v4
        with:
          name: litellm-1.93.0-cp313-win-whl
          path: dist/*.whl
          if-no-files-found: error
