name: Build Windows litellm 1.93.0 wheel
on:
  workflow_dispatch: # 手动触发（重点！你自己点按钮跑）

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Checkout v1.93.0 tag
        run: git checkout v1.93.0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin setuptools wheel

      - name: Build whl package
        run: maturin build --release --target x86_64-pc-windows-msvc --out dist

      - name: Upload built wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: litellm-1.93.0-win-whl
          path: dist/*.whl
