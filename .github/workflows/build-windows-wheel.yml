name: Build Windows litellm 1.93.0 wheel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout official litellm v1.93.0
        uses: actions/checkout@v4
        with:
          repository: BerriAI/litellm
          ref: v1.93.0
          submodules: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin setuptools wheel

      - name: Build whl package
        run: maturin build --release --target x86_64-pc-windows-msvc --out dist

      - name: Upload built wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: litellm-1.93.0-win-whl
          path: dist/*.whl
